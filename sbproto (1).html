<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Service Bench · Journeys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Fixed icon rail (always collapsed) + hover-revealed second-tier menu, sticky top bar, white cards on a near-white page. Light only by design. */
:root{
  color-scheme:light;
  --page:#FFFFFF; --white:#FFFFFF; --hover:#F3F4F6; --active:#E9EAEE; --line:#E5E7EB; --line-2:#F0F1F3;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --pink:#E0457B; --pink-soft:#FDECF2;
  --lav:#0473EA; --lav-bg:#E5F1FC; --lav-line:#CFE3F8;
  --green:#15803D; --green-bg:#DCFCE7; --green-line:#BBF7D0;
  --amber:#B45309; --amber-bg:#FEF3C7; --amber-line:#FDE68A;
  --red:#B91C1C; --red-bg:#FEE2E2; --red-line:#FECACA;
  --shadow:0 1px 2px rgba(17,24,39,.04);
  --shadow-pop:0 10px 30px rgba(17,24,39,.12),0 2px 6px rgba(17,24,39,.06);
  --f:"SC Prosper Sans","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --rail:56px; --rail-x:208px; --tier:216px; --top:56px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f);font-size:.875rem;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:16px;height:16px}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em;text-wrap:balance}

/* Rail (L1): collapsed to icons, expands with labels on hover */
.rail{position:fixed;top:var(--top);left:0;bottom:0;width:var(--rail);background:var(--white);border-right:1px solid var(--line);z-index:31;display:flex;flex-direction:column;overflow:hidden;
  transition:width .3s var(--ease),box-shadow .3s var(--ease),transform .36s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.rail.exp{width:var(--rail-x);box-shadow:var(--shadow-pop)}
.brand{position:fixed;top:0;left:0;width:var(--rail);height:var(--top);z-index:33;background:var(--white);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;place-items:center}
.logo-mark{width:28px;height:28px;display:grid;place-items:center}
.logo-mark svg{width:16px;height:25px}
.menu-btn{width:32px;height:32px;border-radius:7px;display:none;place-items:center;color:var(--ink-2)}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{background:var(--hover)}
body.sec .logo-mark{display:none}
body.sec .menu-btn{display:grid}
body.sec .rail{transform:translateX(-101%)}
body.sec.railshow .rail{transform:none;box-shadow:var(--shadow-pop)}
body.sec .tier{left:0}
body.sec .page{margin-left:0}
.rail-in{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 8px 8px;overflow-y:auto;overflow-x:hidden}
.lbl-x{white-space:nowrap;opacity:0;transition:opacity .15s ease;font-size:13.5px}
.rail.exp .lbl-x{opacity:1;transition:opacity .24s ease .08s}
.plus{width:100%;height:36px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;gap:10px;padding:0 11px;margin-bottom:6px;flex:none}
.plus:hover{background:var(--ink-strong)}
.plus .lbl-x{font-weight:500}
.r-btn{width:100%;height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 11px;color:var(--ink-2);position:relative;flex:none;text-align:left}
.r-btn:hover{background:var(--hover)}
.r-btn[aria-current="true"]{background:var(--sel);color:var(--ink)}
.r-btn[aria-current="true"] .lbl-x{font-weight:500}
.r-btn .chev{margin-left:auto;opacity:0;color:var(--faint)}
.rail.exp .r-btn .chev{opacity:1}
.r-btn .dot{position:absolute;top:6px;left:24px;width:7px;height:7px;border-radius:50%;background:var(--pink);border:1.5px solid var(--white)}
.r-sep{width:100%;height:1px;background:var(--line);margin:6px 0;flex:none}
.r-spacer{flex:1}
.ask-btn{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px;box-shadow:var(--shadow);margin-bottom:2px;flex:none}
.ask-btn:hover{background:var(--hover)}
.r-foot{border-top:1px solid var(--line);padding:8px;flex:none}

.rail svg.i,.brand svg.i,.top svg.i{width:18px;height:18px}
.rail .chev svg.i{width:14px;height:14px}
.top svg.s{width:15px;height:15px}

/* App pill: each app's own vertical menu */
.app-pill{position:fixed;left:calc((var(--rail) - 44px) / 2 + env(safe-area-inset-left,0px));top:calc(var(--top) + 12px);z-index:25;width:44px;
  display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateX(-10px);pointer-events:none;transition:opacity .3s ease,transform .4s var(--ease)}
body.app .app-pill{opacity:1;transform:none;pointer-events:auto}
body.app.pill-hidden .app-pill{opacity:0;transform:translateX(-8px);pointer-events:none}
.pill{width:44px;padding:4px;background:var(--white);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.term{width:44px;height:44px;border-radius:50%;background:var(--ink);border:1px solid var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--on-ink);position:relative;transition:box-shadow .3s var(--ease),background .2s ease}
.term svg.i{width:18px;height:18px}
.term:hover{background:var(--ink-strong)}
.term[aria-pressed="true"]{box-shadow:0 0 0 3px var(--page),0 0 0 5px var(--ink)}
/* Agent terminal panel */
.tpanel{position:fixed;z-index:24;left:calc(var(--rail) + 8px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:min(300px,45vh);
  background:#111111;color:#E5E7EB;border-radius:14px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;transform:translateY(20px) scale(.985);transform-origin:20% 100%;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .3s var(--ease)}
body.app.term-open .tpanel{transform:none;opacity:1;pointer-events:auto;transition:opacity .32s ease,transform .5s var(--ease)}
.tp-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid #262626;font-family:var(--f);font-size:13px;color:#9CA3AF}
.tp-head b{color:#F9FAFB;font-weight:600}
.tp-head button{margin-left:auto;width:28px;height:28px;border-radius:7px;color:#9CA3AF;display:grid;place-items:center;font-size:18px}
.tp-head button:hover{background:#1F1F1F;color:#fff}
.tp-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:4px;line-height:1.55}
.tp-body .u{color:#F9FAFB}.tp-body .u::before{content:"› ";color:#7FC0FF}
.tp-body .a{color:#9CA3AF}
.tp-body .ok{color:#4ADE80}
.tp-in{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid #262626}
.tp-in span{color:#7FC0FF}
.tp-in input{flex:1;min-width:0;background:none;border:0;outline:0;color:#F9FAFB;font:inherit}
.tp-in input::placeholder{color:#6B7280}
body.app.term-open .shift main{padding-bottom:calc(min(300px,45vh) + 40px)}
.app-badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.app-badge svg.i{width:18px;height:18px}
.pill-sep{width:20px;height:1px;background:var(--line);margin:3px 0}
.pill-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative}
.pill-btn svg.i{width:18px;height:18px}
.pill-btn:hover{background:var(--hover)}
.pill-btn[aria-current="true"]{background:var(--active);color:var(--ink)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:2}
body.app .page .shift{margin-left:calc(var(--rail) - 8px)}
body.app.pill-hidden .page .shift{margin-left:0}
.app-head{display:flex;flex-direction:column;gap:4px}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.app-head h1{font-size:22px;font-weight:600}
.app-head p{margin:0;color:var(--muted)}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ph{border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;background:var(--white)}
.ph i{display:block;height:10px;border-radius:99px;background:var(--hover)}
.ph-main{min-height:260px;display:grid;place-items:center;text-align:center}
.ph-main div{max-width:46ch;display:flex;flex-direction:column;gap:6px;align-items:center}
.ph-main b{font-size:16px;font-weight:600}
.ph-main span{color:var(--muted)}
@media (max-width:720px){.ph-grid{grid-template-columns:1fr}}

/* Second tier */
.tier{position:fixed;top:var(--top);bottom:0;left:var(--rail);width:var(--tier);background:var(--white);border-right:1px solid var(--line);z-index:29;padding:10px 8px;display:flex;flex-direction:column;gap:1px;
  transform:translateX(-14px);opacity:0;pointer-events:none;transition:opacity .26s ease,transform .38s var(--ease),box-shadow .3s ease}
.tier.open{transform:none;opacity:1;pointer-events:auto}
.tier.preview{left:var(--rail);z-index:30;box-shadow:var(--shadow-pop)}
body.sec .tier.preview{left:var(--rail)}
.t-head{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px;margin-bottom:4px;font-size:.875rem;font-weight:600;color:var(--ink)}
.t-head button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2)}
.t-head button:hover{background:var(--hover)}
.t-label{font-size:11.5px;color:var(--muted);padding:10px 10px 3px;font-weight:500}
.t-item{display:flex;align-items:center;justify-content:space-between;text-align:left;height:32px;padding:0 10px;border-radius:7px;font-size:13.5px;color:var(--ink-2);font-weight:450}
.t-item:hover{background:var(--hover)}
.t-item[aria-current="true"]{background:var(--active);color:var(--ink);font-weight:500}
.t-count{font-size:12px;color:var(--muted);font-weight:500}

/* Page + top bar */
.page{margin-left:var(--rail);min-height:100vh;overflow-x:clip;padding-top:calc(var(--top) + var(--obar));transition:padding-top .38s var(--ease)}
/* Open-apps bar (platform pages only) */
:root{--obar:0px}
body:not(.app){--obar:48px}
.obar{position:fixed;top:var(--top);left:var(--rail);right:0;height:48px;z-index:19;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .38s var(--ease),opacity .25s ease}
body:not(.app) .obar{transform:none;opacity:1;pointer-events:auto}
body.sec .obar{left:0}
.obar-l{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;margin-right:4px}
.obar-list{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.obar-list::-webkit-scrollbar{display:none}
.ochip{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 5px;border:1px solid var(--line);border-radius:999px;background:var(--white);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;flex:none;animation:tab-in .4s var(--ease)}
.ochip:hover{background:var(--hover);color:var(--ink)}
.ochip .tx{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-size:15px;line-height:1}
.ochip .tx:hover{background:var(--active);color:var(--ink)}
.obar-close{font-size:13px;color:var(--muted);height:30px;padding:0 10px;border-radius:7px;white-space:nowrap}
.obar-close:hover{background:var(--hover);color:var(--ink)}
.shift{transition:margin-left .38s var(--ease)}
.page.pinned .shift{margin-left:var(--tier)}
.top{position:fixed;top:0;left:var(--rail);right:0;z-index:20;height:var(--top);background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tog{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.title-area{align-self:stretch;display:flex;align-items:center;gap:2px;min-width:0;flex:0 1 auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-bottom:-1px}
.title-area::-webkit-scrollbar{display:none}
.title-area.tabs{align-items:flex-end;padding-left:2px}
.title-area.tabs .app-title{align-self:center;margin-right:10px}
/* Index ("phonebook") tabs: the active one is cut from the page itself */
.ptab{position:relative;display:flex;align-items:center;gap:8px;height:40px;max-width:200px;padding:0 8px 0 10px;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;
  color:var(--muted);font-size:.875rem;font-weight:500;white-space:nowrap;flex:none;transition:background .2s ease,color .2s ease;animation:tab-in .4s var(--ease)}
@keyframes tab-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptab:hover{background:var(--hover);color:var(--ink-2)}
.ptab[aria-selected="true"]{background:var(--page);border-color:var(--line);color:var(--ink);font-weight:600;font-size:1.125rem;height:44px;z-index:1}
.ptab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--page)}
.aico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.aico svg.i{width:12px;height:12px;stroke-width:1.8}
.ptab[aria-selected="true"] .aico{width:22px;height:22px}
.ptab[aria-selected="true"] .aico svg.i{width:13px;height:13px}
.ptab .tname{overflow:hidden;text-overflow:ellipsis}
.ptab .tx{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--faint);font-size:15px;line-height:1;opacity:0;transition:opacity .15s}
.ptab:hover .tx,.ptab[aria-selected="true"] .tx{opacity:1}
.ptab .tx:hover{background:var(--active);color:var(--ink)}
.ptab+.ptab:not([aria-selected="true"])::before{content:"";position:absolute;left:-2px;top:12px;bottom:12px;width:1px;background:var(--line)}
.ptab[aria-selected="true"]+.ptab::before{display:none}
.t-div{display:inline-block;width:1px;height:18px;background:var(--ink);margin:0 12px;vertical-align:middle;position:relative;top:-1px}
.t-mod{font-size:.875rem;font-weight:500;color:var(--ink);letter-spacing:0;vertical-align:middle}
.ptab .t-div{height:16px;margin:0 4px}
.ptab[aria-selected="true"]{max-width:none}
.app-title{display:flex;align-items:center;font-size:1.125rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;margin-left:4px}
#tog{display:none}
body.sec #tog{display:grid}
.tog:hover,.tog[aria-pressed="true"]{background:var(--hover)}
.search{display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 6px 0 10px;width:280px;margin-right:8px;font-size:13px;color:var(--faint);background:var(--white);min-width:0}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;color:var(--ink);background:none}
.search input::placeholder{color:var(--faint)}
kbd{font-family:var(--f);font-size:10.5px;line-height:1.5;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--white)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:4px;min-width:0;flex:1;justify-content:flex-end}
.tlink{font-size:.875rem;color:var(--ink-2);white-space:nowrap;height:32px;padding:0 9px;border-radius:7px}
.tlink:hover{background:var(--hover)}
.tlink:hover{color:var(--ink)}
.ticon{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--ink-2);position:relative}
.ticon:hover{background:var(--hover)}
.ticon .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;}
.ticon .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);border:1.5px solid var(--white)}
.me{width:28px;height:28px;border-radius:50%;background:#1F2937;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.r-me{width:100%;height:40px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 6px;text-align:left}
.r-me:hover{background:var(--hover)}
.r-me .lbl-x{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.r-me .lbl-x b{font-weight:600;font-size:13px;color:var(--ink)}
.r-me .lbl-x small{font-size:11.5px;color:var(--muted)}

/* Top bar groups (platform vs. app) */
.top-group{display:flex;align-items:center;gap:4px;animation:tg-in .35s var(--ease)}
@keyframes tg-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.dd-wrap{position:relative}
.tlink.dd{display:inline-flex;align-items:center;gap:4px}
.tlink.dd svg.i{width:14px;height:14px;color:var(--muted);transition:transform .25s var(--ease)}
.tlink.dd[aria-expanded="true"]{background:var(--hover)}
.tlink.dd[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.dd-wrap .menu{left:0;right:auto;min-width:200px}
.set-wrap .menu{left:auto;right:0}
#topSettings[aria-expanded="true"]{background:var(--hover)}
.new-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:500;margin:0 6px 0 4px;white-space:nowrap}
.new-btn:hover{background:var(--ink-strong)}
.new-btn svg.i{width:16px;height:16px}

/* App loading state */
.loading{min-height:calc(100vh - var(--top) - 120px);display:grid;place-items:center;font-size:15px;color:var(--muted);font-weight:500;animation:ld-in .2s ease}
.ell i{font-style:normal;display:inline-block;animation:ell .5s ease-in-out infinite both}
.ell i:nth-child(2){animation-delay:.1s}.ell i:nth-child(3){animation-delay:.2s}
@keyframes ell{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ld-in{from{opacity:0}to{opacity:1}}

/* Product splash: Intellibox launcher. Initialises on the left while you pick an instance on the right. */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(11,37,69,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:sp-fade .35s ease both}
.splash.out{animation:sp-out .4s ease both}
@keyframes sp-fade{from{opacity:0}to{opacity:1}}
@keyframes sp-out{to{opacity:0}}
.sp-card{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(11,37,69,.35),0 0 0 1px rgba(0,0,0,.04);animation:sp-pop .6s var(--ease) both}
.splash.out .sp-card{animation:sp-shrink .4s var(--ease) both}
@keyframes sp-pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sp-shrink{to{opacity:0;transform:scale(.98)}}
.ib{width:min(1040px,100%);height:min(600px,calc(100vh - 32px));display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);background:var(--white);color:var(--ink)}
.ib-art{position:relative;background:#E9EEF3;overflow:hidden}
.ib-shapes{position:absolute;inset:0;width:100%;height:100%}
.ib-shapes path{transform-box:fill-box;animation:ib-shape .9s var(--ease) both}
.ib-shapes .s1{transform-origin:100% 0;animation-delay:.05s}
.ib-shapes .s2{transform-origin:100% 100%;animation-delay:.15s}
.ib-shapes .s3{transform-origin:100% 0;animation-delay:.25s}
.ib-shapes .s4{transform-origin:0 50%;animation-delay:.35s}
.ib-shapes .s5{transform-origin:0 100%;animation-delay:.45s}
@keyframes ib-shape{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ib-brand{position:absolute;left:0;right:0;bottom:0;padding:26px 30px 26px;background:#E9EEF3;border-top-right-radius:200px 120px}
.ib-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:#0B2545}
.ib-logo b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.ib-logo small{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:10.5px;color:#3E4A5C;margin-top:4px}
.ib-logo small svg.i{width:11px;height:11px}
.ib-mark{width:46px;height:46px;display:grid;place-items:center;position:relative;flex:none}
.ib-mark svg.i{width:46px;height:46px}
.ib-status{font-size:13px;color:#24303F;min-height:20px;display:flex;align-items:baseline}
#spMsg{transition:opacity .2s ease}
.ib-bar{height:5px;border-radius:99px;background:#0B2545;overflow:hidden;margin:8px 0 16px}
.ib-bar i{display:block;height:100%;width:0;border-radius:inherit;background:#38D200;transition:width .5s var(--ease)}
.ib-ver{font-size:12.5px;font-weight:600;color:#0B2545}
.ib-pick{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:0;background:var(--white)}
.ib-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;z-index:2}
.ib-x:hover{background:var(--hover);color:var(--ink)}
.ib-list-col{display:flex;flex-direction:column;min-height:0;padding:28px 14px 18px 24px;border-right:1px solid var(--line)}
.ib-search{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line-strong,var(--line));border-radius:999px;padding:0 14px;background:var(--white);margin-bottom:12px;flex:none}
.ib-search:focus-within{border-color:var(--link);box-shadow:0 0 0 3px var(--sel-line)}
.ib-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13.5px;color:var(--ink)}
.ib-search svg.i{width:15px;height:15px;color:var(--muted)}
.ib-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:2px 6px 2px 2px;outline:0;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.ib-opt{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--ink-2);cursor:pointer;line-height:1.35;transition:background .15s ease}
.ib-opt:hover{background:var(--hover)}
.ib-opt[aria-selected=true]{background:var(--sel-soft,var(--sel));color:var(--ink);font-weight:500}
.ib-opt small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.ib-list.kb:focus .ib-opt[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--link)}
.ib-status.ready .ell{display:none}
html[data-theme="dark"] .splash{background:rgba(0,0,0,.5)}
.ib-none{padding:12px;font-size:13.5px;color:var(--muted)}
.ib-detail{padding:30px 34px 26px 28px;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.ib-detail .v{display:flex;flex-direction:column;transition:opacity .18s ease,transform .25s var(--ease)}
.ib-detail.chg .v{opacity:0;transform:translateY(6px)}
.ib-detail h2{font-size:1.25rem;font-weight:600;letter-spacing:-.015em;line-height:1.2;margin:0 28px 6px 0}
.ib-detail .code{font-size:12px;color:var(--muted);margin-bottom:12px}
.ib-detail p{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.ib-meta{display:flex;flex-direction:column;gap:6px;margin:2px 0 20px;font-size:12px;color:var(--muted)}
.ib-meta span{display:flex;align-items:center;gap:8px}
.ib-meta svg.i{width:14px;height:14px}
.ib-go{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:0;border-radius:999px;background:#0473EA;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s ease,transform .1s ease}
.ib-go:hover{background:#0360C4}
.ib-go:active{transform:scale(.98)}
.ib-go svg.i{width:17px;height:17px}
.ib-go[disabled]{opacity:.8;cursor:progress}
.ib-go .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:ib-spin .8s linear infinite}
@keyframes ib-spin{to{transform:rotate(360deg)}}
.ib-hint{font-size:12px;color:var(--muted);margin-top:10px}
.ib-hint kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--page)}
html[data-theme="dark"] .ib-x:hover{background:#262626}
@media (max-width:860px){
  .ib{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:min(720px,calc(100vh - 32px))}
  .ib-art{height:150px}
  .ib-shapes{left:auto;width:58%}
  .ib-brand{position:absolute;inset:auto auto 0 0;right:40%;padding:16px 18px;border-radius:0 120px 0 0}
  .ib-logo{margin-bottom:10px}.ib-logo b{font-size:22px}.ib-mark,.ib-mark svg.i{width:36px;height:36px}
  .ib-bar{margin:6px 0 8px}.ib-ver{display:none}
  .ib-pick{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .ib-list-col{border-right:0;border-bottom:1px solid var(--line);padding:16px 14px 8px}
  .ib-detail{padding:16px 18px 18px;overflow:visible}
  .ib-detail h2{font-size:1.125rem}
  .ib-detail p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
  .ib-meta,.ib-hint{display:none}
  .ib-go{align-self:stretch;justify-content:center}
  .ib-x{color:#0B2545;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .ib-x:hover{background:#fff}
}
@media (prefers-reduced-motion:reduce){.ib-shapes path,.ib-go .spin{animation:none}}

/* ---------- Onboarding dashboard ---------- */
:root{--human:#D9622B;--human-bg:#FDF1E8;--human-line:#F3D2BA;--human-ink:#8A3A0F;--system:#0473EA;--system-bg:#E5F1FC;--system-ink:#0B4FA8}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dash-head h1{font-size:24px;font-weight:600;letter-spacing:-.015em}
.role-line{margin-top:8px}
.persona-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:var(--white);font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--shadow);max-width:100%}
.persona-chip:hover{background:var(--hover)}
.persona-chip .muted{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.persona-chip svg.s{width:14px;height:14px}
.lede{margin:10px 0 0;color:var(--ink-2);max-width:70ch}
.lede b{font-weight:600;color:var(--human-ink)}
.kpi-sub{font-size:12.5px;color:var(--muted)}
.kpi-sub.warn{color:var(--amber);font-weight:500}
.kpi-sub.good{color:var(--green);font-weight:500}
.nx .age{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.legend-mini{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend-mini i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.jstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.jst{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;background:var(--white);display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .2s,box-shadow .2s}
.jst:hover{border-color:var(--line-strong)}
.jst[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.jnum{font-size:11.5px;color:var(--muted);font-weight:500}
.jname{font-size:16px;font-weight:600}
.jdesc{font-size:12.5px;color:var(--muted);line-height:1.4;min-height:2.8em}
.jcount{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.jcount small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.jlead{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:2px}
.jbar{display:block;height:6px;border-radius:99px;background:var(--system);overflow:hidden}
.jbar i{display:block;height:100%;background:var(--human)}
.jneed{align-self:flex-start;margin-top:4px;font-size:12px;font-weight:600;color:var(--human-ink);background:var(--human-bg);border:1px solid var(--human-line);border-radius:99px;padding:1px 8px}
.jneed.none{color:var(--muted);background:var(--page);border-color:var(--line);font-weight:500}
.clear-f{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--system-ink);margin:-8px 0 8px;font-weight:500}
.hchip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 9px;border:1px solid transparent;white-space:nowrap}
.h-you{background:var(--human-bg);border-color:var(--human-line);color:var(--human-ink)}
.h-sys{background:var(--system-bg);color:var(--system-ink)}
.h-spec{background:var(--hover);color:var(--ink-2)}
.h-cust{background:var(--white);border-color:var(--line);color:var(--ink-2)}
.h-done{background:var(--green-bg);color:var(--green)}
.mini{display:inline-flex;align-items:center}
.md{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--white);flex:none}
.md.d{background:var(--ink);border-color:var(--ink)}
.md.c{width:12px;height:12px;border-width:2.5px}
.md.c.h-you{border-color:var(--human);background:var(--human-bg)}
.md.c.h-sys{border-color:var(--system);background:var(--system-bg)}
.md.c.h-spec,.md.c.h-cust{border-color:var(--ink-2);background:var(--white)}
.ml{width:12px;height:1.5px;background:var(--line-strong)}
.ml.d{background:var(--ink)}
.mlab{margin-left:10px;font-size:13px;color:var(--ink-2)}
.tbl tr.is-mine td:first-child{box-shadow:inset 3px 0 0 var(--human);padding-left:10px}
.tbl td.nx{white-space:normal;min-width:150px;color:var(--ink-2)}
#sec-pipeline .tbl td:first-child{white-space:normal;min-width:160px}
#sec-pipeline .tbl td{padding-inline:10px}
#sec-pipeline .tbl th{padding-inline:10px}
.late{color:var(--red);font-weight:500}
.empty-row{text-align:center;color:var(--muted);padding:28px!important}
.buckets{display:flex;flex-direction:column;gap:16px}
.bucket{display:flex;flex-direction:column;gap:6px}
.b-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--ink)}
.b-n{min-width:22px;height:22px;border-radius:99px;background:var(--hover);display:grid;place-items:center;font-size:12px;font-weight:600;padding:0 6px}
.wi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--white);transition:background .15s,border-color .15s}
.wi:hover{background:var(--page);border-color:var(--line-strong)}
.wi-t{font-weight:600;font-size:13.5px}
.wi-s{grid-column:1;font-size:12.5px;color:var(--muted)}
.wi-tag{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:12px;font-weight:600;color:var(--human-ink);background:var(--human-bg);border-radius:6px;padding:2px 8px}
.wi-tag.fyi{color:var(--ink-2);background:var(--hover)}
.b-empty{font-size:12.5px;color:var(--faint);padding:2px 0}
/* case drawer */
.nextbox{border-radius:12px;padding:16px;background:var(--page);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.nextbox.mine{background:var(--human-bg);border-color:var(--human-line)}
.nextbox .lbl{margin:0}
.nb-t{font-size:16px;font-weight:600}
.nb-s{color:var(--ink-2)}
.reason{display:flex;gap:8px;margin-top:6px;padding:10px 12px;border-radius:9px;background:var(--white);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.reason svg{flex:none;margin-top:2px;color:var(--system)}
.prefill{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-top:6px}
.pf-bar{width:120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pf-bar i{display:block;height:100%;background:var(--system)}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.ck-i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--hover);color:var(--muted)}
.ck-i.clear{background:var(--green-bg);color:var(--green)}
.ck-i.hit{background:var(--red-bg);color:var(--red)}
.ck-s{font-size:12.5px;font-weight:600;color:var(--muted)}
.ck-s.clear{color:var(--green)}.ck-s.hit{color:var(--red)}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--ink-2)}
.trail b{font-weight:600;color:var(--ink)}
.trail small{display:block;color:var(--faint);font-size:12px}
/* persona + nav dialog */
.modal-back{position:fixed;inset:0;z-index:55;background:rgba(17,24,39,.32);display:grid;place-items:center;padding:16px;animation:sp-fade .25s ease both}
.modal{width:min(600px,100%);max-height:min(760px,calc(100vh - 32px));background:var(--white);border-radius:16px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;animation:sp-pop .45s var(--ease) both}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:18px;font-weight:600}
.m-body{padding:18px 20px;overflow-y:auto}
.m-foot{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pcard:has(input:checked){border-color:var(--system);background:var(--sel)}
.pcard input{margin-top:3px;accent-color:#0473EA}
.pcard b{display:block;font-size:13.5px;font-weight:600}
.pcard small{font-size:12px;color:var(--muted)}
.navlist{display:flex;flex-direction:column;gap:2px}
.ng-l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) 28px 28px 40px;align-items:center;gap:6px;padding:5px 6px;border-radius:8px}
.nrow:hover{background:var(--page)}
.nrow.off .nr-l,.nrow.off .nr-i{opacity:.45}
.nr-l{font-size:14px}
.nr-l small{color:var(--muted);font-size:12px}
.nr-m{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.nr-m svg{transform:rotate(90deg)}
.nr-m.dn svg{transform:rotate(-90deg)}
.nr-m:hover:not(:disabled){background:var(--hover)}
.nr-m:disabled{opacity:.25;cursor:default}
.sw{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:99px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;margin:0;justify-self:end}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw:checked{background:#0473EA}
.sw:checked::after{transform:translateX(16px)}
.sw:disabled{opacity:.5;cursor:default}
@media (max-width:1100px){.jstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.persona-chip{white-space:nowrap}.persona-chip .muted{display:none}#sec-pipeline .seg button{padding:6px 8px;white-space:nowrap}.jstrip{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid{grid-template-columns:1fr}.jdesc{display:none}}

.dom-btn svg.i{width:14px;height:14px;color:var(--muted)}

.jl{display:inline-flex;align-items:center;gap:6px}
.jl-n{min-width:18px;height:18px;border-radius:99px;background:var(--human-bg);color:var(--human-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.me-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--sel);color:var(--sel-ink);font-size:.875rem;font-weight:600;margin:0 2px 0 6px;white-space:nowrap}
.me-btn:hover,.me-btn[aria-expanded="true"]{background:var(--sel-2)}
.me-btn svg.i{width:16px;height:16px}
.me-n{min-width:18px;height:18px;border-radius:99px;background:#0473EA;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.me-menu button{white-space:nowrap;gap:16px}

.dom-menu button small{margin-left:8px;margin-right:auto}
.me-menu .mi-2 span{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.me-menu .mi-2 b{font-weight:600;font-size:13.5px}
.me-menu small.warn{color:var(--amber)}.me-menu small.good{color:var(--green)}
.infer-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sel);border:1px solid var(--sel-line);border-radius:12px;padding:10px 12px 10px 14px;color:var(--ink-2)}
.infer-note svg{color:var(--link);flex:none}
.infer-note span{flex:1 1 320px}
.infer-note b{font-weight:600;color:var(--ink)}
.btn.ghostb{background:none;border-color:transparent;box-shadow:none}
.facts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}

.f-k{font-size:12.5px;color:var(--muted);font-weight:500}
.f-v{font-weight:600;font-size:14px;display:flex;flex-direction:column}
.f-v small{font-weight:400;font-size:12px;color:var(--muted)}
.f-a{font-size:13px;color:var(--link);font-weight:600;padding:4px 8px;border-radius:6px}

.inf{font-style:normal;font-size:11px;font-weight:600;color:var(--sel-ink);background:var(--sel);border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
@media (max-width:720px){.me-l{display:none}.me-btn{padding:0 8px;margin:0}.dom-btn{max-width:150px;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:480px){.title-area .app-title{display:none!important}.dom-btn{max-width:120px}}

  .top .search{flex:0 0 34px;width:34px;padding:0;justify-content:center;border-color:transparent;cursor:pointer}

  .top .search.open{position:absolute;left:8px;right:8px;top:11px;width:auto;flex:none;z-index:6;padding:0 10px;border-color:var(--line);background:var(--white);box-shadow:var(--shadow-pop);justify-content:flex-start}
  .top .search.open input{width:auto;flex:1}
}

.jl-c{width:14px!important;height:14px!important;color:var(--muted);margin-left:-2px;transition:transform .25s var(--ease)}
.tlink[aria-expanded="true"]{background:var(--hover)}
.tlink[aria-expanded="true"] .jl-c{transform:rotate(180deg)}
.jpanel{position:fixed;z-index:45;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);padding:16px;display:flex;flex-direction:column;gap:14px;animation:jp-in .3s var(--ease) both;max-height:calc(100vh - var(--top) - 24px);overflow-y:auto}
@keyframes jp-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.jp-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.jp-h b{font-size:15px;font-weight:600}
.jp-h .muted{font-size:12.5px}
.jp-stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.jp-st{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;text-align:left;transition:border-color .15s,background .15s}
.jp-st:hover,.jp-st:focus-visible{border-color:var(--line-strong);background:var(--page)}
.jp-sn{font-size:12px;color:var(--muted);font-weight:500}
.jp-sc{font-size:20px;font-weight:600;line-height:1.15}
.jp-need{font-size:11px;font-weight:600;color:var(--human-ink);background:var(--human-bg);border-radius:99px;padding:0 6px}
.jp-need.none{background:none;color:var(--faint);padding:0}
.jp-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.jp-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.jp-l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.jp-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;text-align:left;padding:8px 10px;border-radius:9px}
.jp-item:hover,.jp-item:focus-visible{background:var(--page)}
.jp-n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jp-w{grid-column:1;font-size:12.5px;color:var(--muted)}
.jp-age{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:12px;color:var(--muted);white-space:nowrap}
.jp-age.late{color:var(--red);font-weight:500}
.jp-more{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:13px;font-weight:600;color:var(--link);padding:6px 10px;border-radius:7px}
.jp-more:hover{background:var(--sel)}
.jp-more svg{width:14px;height:14px}
.jp-empty{font-size:13px;color:var(--muted);padding:8px 10px}
.jp-acts{border-left:1px solid var(--line-2);padding-left:16px}
.jp-a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:500;text-align:left}
.jp-a:hover,.jp-a:focus-visible{background:var(--page)}
.jp-a svg{width:16px;height:16px;color:var(--ink-2)}
.burger-menu .mi-sub{padding-left:22px;display:flex;flex-direction:column;align-items:flex-start!important;gap:0;font-size:13px}
.burger-menu .mi-sub small{font-size:11.5px;color:var(--muted)}
@media (max-width:600px){.jp-body{grid-template-columns:1fr}.jp-acts{border-left:0;padding-left:0;border-top:1px solid var(--line-2);padding-top:10px}.jp-stages{grid-template-columns:repeat(3,minmax(0,1fr))}}

.tlink.jl[aria-expanded="true"]{position:relative;background:transparent;color:var(--ink)}
.tlink.jl[aria-expanded="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:-12px;height:2px;border-radius:2px;background:var(--ink)}
.mega-scrim{position:fixed;right:0;bottom:0;z-index:40;background:rgba(17,24,39,.06);animation:sp-fade .2s ease}
.mega{position:fixed;right:0;z-index:41;background:var(--white);border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(17,24,39,.10);animation:mega-in .32s var(--ease) both;max-height:calc(100vh - var(--top));overflow-y:auto}
@keyframes mega-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mega-in{max-width:none;margin:0;padding:22px 32px 26px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr)) minmax(240px,.9fr);gap:24px}
.mega-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.mega-grp{display:flex;flex-direction:column;gap:2px}
.mega-h{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px}
.mega-item{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:10px;text-align:left;width:100%;transition:background .15s}
.mega-item:hover,.mega-item:focus-visible{background:var(--page)}
.mega-ic{width:34px;height:34px;border-radius:9px;background:var(--hover);display:grid;place-items:center;flex:none;color:var(--ink-2);transition:background .15s,color .15s}
.mega-ic svg.i{width:18px;height:18px}
.mega-item:hover .mega-ic{background:var(--sel);color:var(--link)}
.mega-t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink)}
.mega-n{min-width:18px;height:18px;border-radius:99px;background:var(--human-bg);color:var(--human-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.mega-d{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.mega-feat{display:flex;flex-direction:column}
.mega-feat .mega-h{padding-left:0}
.mega-card{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mega-card b{font-size:16px;font-weight:600}
.mega-card p{margin:0;font-size:13px;line-height:1.5}
.mega-card .btn{margin-top:8px}
.mega-card.dark{background:#0B2545;color:#fff}
.mega-card.dark p{color:rgba(255,255,255,.78)}
.mega-card.dark .btn{background:#fff;color:#0B2545;border-color:#fff}
.mega-card.light{background:var(--sel);color:var(--ink)}
.mega-card.light p{color:var(--ink-2)}
@media (min-width:1101px){.mega .mega-head{display:none}}
.mega-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;max-width:none}
.mega-head b{font-size:16px;font-weight:600;flex:1}
.mega-head.stacked{flex-direction:column;align-items:stretch;gap:12px}
.mega-head.stacked b{font-size:18px}
.mega-nav{display:flex;justify-content:space-between;align-items:center}
.mega-back{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 10px 0 4px;margin-left:-4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--link)}
.mega-back:hover,.mega-back:focus-visible{background:var(--sel)}
.mega-back svg{width:14px;height:14px}
.mega-x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);font-size:18px;line-height:1;display:grid;place-items:center}
.mega-x:hover{background:var(--hover)}
@media (max-width:1100px){
  .mega .mega-in,.mega .mega-in.snap{grid-template-columns:repeat(2,minmax(0,1fr));padding:16px 20px 22px;gap:18px}
  .mega .mega-snap .jp-h b{display:none}
  .mega-in .mega-feat{grid-column:1 / -1;order:-1}
}
@media (max-width:720px){
  .mega .mega-in,.mega .mega-in.snap{grid-template-columns:1fr;padding:12px 16px 20px}
  .mega-scrim{display:none}
  .mega{bottom:0;max-height:none;border-bottom:0}
}
.burger-menu .mi-jp{justify-content:space-between!important}
.burger-menu .mi-jp svg{width:14px;height:14px;color:var(--muted);margin:0}

.mega-in.snap{grid-template-columns:repeat(var(--cols),minmax(0,1fr)) minmax(0,2.1fr)}
.mega-snap{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mega-snap .jp-st{background:var(--white)}
.mega-snap .jp-item:hover,.mega-snap .jp-item:focus-visible{background:var(--white)}
.mega-snap .jp-item{padding:8px 10px;margin:0 -10px}

/* Content */
.content{max-width:1640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
@media (min-width:1100px){.content{padding-left:56px;padding-right:56px}}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 28px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card-h h2{font-size:18px}
.card-h p{margin:4px 0 0;color:var(--muted);font-size:.875rem}
.card-h em{font-style:italic;color:var(--ink-2);font-size:.875rem;display:block;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--white);font-size:.875rem;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{height:34px;font-size:13.5px;padding:0 11px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.dark:hover{background:var(--ink-strong)}
.btn.icon{width:42px;padding:0;justify-content:center}
.btn .lav{color:var(--lav)}
.a-pink{color:var(--pink);font-weight:500}
.a-pink:hover{text-decoration:underline}
.muted{color:var(--muted)}

/* Hello + KPIs */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hello h1{font-size:19px}
.hello p{margin:4px 0 0;color:var(--muted);font-size:.875rem}
.hello-r{display:flex;align-items:center;gap:12px;position:relative}
.streak{display:flex;gap:6px;align-items:center}
.hex{width:40px;height:44px;display:grid;place-items:center;font-size:.875rem;font-weight:600;color:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.hex i{width:38px;height:42px;display:grid;place-items:center;clip-path:inherit;background:var(--white);font-style:normal}
.hex.lav{background:var(--lav-line)}.hex.lav i{background:var(--lav-bg);color:var(--lav)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:var(--line-strong)}
.chip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--page);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.chip svg{width:13px;height:13px;stroke-width:1.8}
.chip.g{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.chip.r{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.chip.a{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.chip.l{background:var(--lav-bg);border-color:var(--lav-line);color:var(--lav)}
.kpi-l{display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--ink-2)}
.kpi-l svg{width:15px;height:15px;color:var(--muted)}
.kpi-v{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15}

/* Range menu */
.range{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;min-width:180px;z-index:10;display:flex;flex-direction:column}
.menu button{text-align:left;padding:8px 10px;border-radius:7px;font-size:.875rem;display:flex;justify-content:space-between}
.menu button:hover{background:var(--hover)}
.menu button[aria-checked="true"]::after{content:"✓";color:var(--lav);font-weight:600}

/* Row 2 */
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.chart-wrap{position:relative;margin-top:2px}
.chart{display:block;width:100%;height:200px}
.chart text{font-family:var(--f);font-size:13px;fill:var(--muted)}
.legend{display:flex;justify-content:center;gap:20px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.tip{position:absolute;pointer-events:none;background:var(--white);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-112%);opacity:0;transition:opacity .12s;box-shadow:var(--shadow-pop)}
.tip b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.tip div{display:flex;align-items:center;gap:6px}
.tip i{width:7px;height:7px;border-radius:50%;display:inline-block}

.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:.875rem;color:var(--ink-2)}
.mrow svg{color:var(--ink-2)}
.mrow .v{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2)}
.foot-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.mrow .chip{line-height:18px;padding-block:0}
.mrow svg.i{width:18px;height:18px}
.spot-nav{display:flex;gap:8px}

/* Decisions (offer cards) */
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.offer{border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:opacity .25s,transform .25s}
.offer.leaving{opacity:0;transform:scale(.98)}
.o-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.875rem;letter-spacing:-.01em;height:30px}
.mono{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.o-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.875rem;font-weight:500;margin-top:8px}
.o-desc{color:var(--muted);font-size:.875rem;margin:0;flex:1}
.o-meta{display:flex;gap:16px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:12px;flex-wrap:wrap}
.o-meta b{font-weight:600}
.o-act{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:500;margin-bottom:4px}

/* Table */
.row3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:.875rem}
.tbl-wrap{overflow-x:auto;margin:0 -28px;padding:0 28px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.c-n{font-weight:500;color:var(--ink)}
.c-s{font-size:13px;color:var(--muted)}
.hb{display:flex;align-items:center;gap:10px}
.hb-t{width:64px;height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:99px}
.sig{color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:.875rem;color:var(--ink-2)}
.feed li:last-child{border-bottom:0}
.fi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--green-bg);color:var(--green)}
.fi.you{background:var(--lav-bg);color:var(--lav)}
.fi svg{width:14px;height:14px;stroke-width:1.8}
.feed small{display:block;color:var(--faint);font-size:12.5px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .32s ease}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--white);z-index:41;transform:translateX(100%);transition:transform .42s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow-pop);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.d-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.d-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h2{font-size:19px}
.d-sub{font-size:.875rem;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px;align-self:flex-start}
.seg button{padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--white);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.d-body{flex:1;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px}
.d-foot{border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.box{border:1px solid var(--line);border-radius:12px;padding:16px}
.lbl{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .box{padding:12px 14px}
.stats b{display:block;font-size:19px;font-weight:600}
.stats span{font-size:12.5px;color:var(--muted)}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.875rem;color:var(--ink-2)}
.why li{display:flex;gap:10px}
.why li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:.55em;flex:none}
.draft{white-space:pre-wrap;font-size:.875rem;color:var(--ink-2)}
textarea.draft{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit;font-size:.875rem;min-height:200px;resize:vertical;color:var(--ink);line-height:1.55}
.journey{display:flex;flex-direction:column;position:relative;padding-left:26px}
.journey::before{content:"";position:absolute;left:7px;top:8px;bottom:12px;width:2px;background:var(--line)}
.step{position:relative;padding-bottom:16px}
.step::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--line-strong)}
.step.done::before{background:var(--green);border-color:var(--green)}
.step.now::before{background:#F59E0B;border-color:#F59E0B;box-shadow:0 0 0 4px var(--amber-bg)}
.step.stuck::before{background:#DC2626;border-color:#DC2626;box-shadow:0 0 0 4px var(--red-bg)}
.step-t{font-weight:500;font-size:.875rem}
.step-n{font-size:13.5px;color:var(--muted);margin-top:2px}
.mood{display:flex;gap:4px;margin-top:12px}
.mood i{flex:1;height:6px;border-radius:3px}
.mood-l{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 48px));background:var(--ink);color:var(--on-ink);border-radius:10px;padding:11px 16px;display:flex;gap:16px;align-items:center;font-size:.875rem;z-index:50;transition:transform .4s var(--ease);max-width:calc(100% - 32px);box-shadow:var(--shadow-pop)}
.toast.on{transform:translate(-50%,0)}
.toast button{color:#7FC0FF;font-weight:600}

@media (max-width:1280px){.top .tlink.opt{display:none}}
@media (max-width:1100px){.top .tlink,.top .tlink.dd{display:none}}
@media (max-width:720px){.top .new-btn{display:none}}
#topBurger[aria-expanded="true"]{background:var(--hover)}
.burger-menu{max-height:calc(100vh - var(--top) - 24px);overflow-y:auto;min-width:220px}
.menu-l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px}

/* L2 comes out from behind the rail */
.tier{transform:translateX(-32px);transition:opacity .24s ease,transform .36s var(--ease),box-shadow .3s ease}
.tier.open{transform:none}
@media (prefers-reduced-motion:reduce){.tier{transition:none}}
/* L2 preview is attached to the rail's edge and travels with it */
.tier{transition:opacity .24s ease,transform .36s var(--ease),box-shadow .3s ease,left .3s var(--ease)}
body.rail-exp .tier.preview,body.sec.rail-exp .tier.preview{left:var(--rail-x)}
.tier.swapping>*{animation:l2swap .2s ease both}
@keyframes l2swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tier{transition:none}.tier.swapping>*{animation:none}}
/* Exit uses an even curve so it reads as a deliberate move-out; arrival keeps the soft ease-out */
body.nav-anim.nav-out .rail,body.nav-anim.nav-out .top>*,body.nav-anim.nav-out .brand>*,body.nav-anim.nav-out .obar{transition-timing-function:cubic-bezier(.45,0,.4,1)}
/* Tooltip anchors to the app icon itself */
.app-badge{position:relative}
/* ===== Home widgets ===== */
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;grid-auto-flow:row dense}
.wg{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.wg-needs{grid-column:span 2}
.wg-cal{grid-row:span 2}
.wg-yours{grid-column:1/-1}
.wg-h{display:flex;align-items:center;gap:8px;min-height:24px}
.wg-h h2{font-size:15px;font-weight:600;margin:0;flex:1;min-width:0}
.wg-ic{width:26px;height:26px;border-radius:7px;background:var(--sel);color:var(--link);display:grid;place-items:center;flex:none}
.wg-ic svg{width:15px;height:15px}
.wg-hide{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s}
.wg:hover .wg-hide,.wg-hide:focus-visible{opacity:1}
.wg-hide:hover{background:var(--hover);color:var(--ink)}
.wg-link{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;color:var(--link);font-weight:600;font-size:13px;padding:2px 0;margin-top:auto}
.wg-link svg{width:14px;height:14px}
.wg-link.sm{margin:0}
.wg-btn{align-self:flex-start;margin-top:auto}
.wg-sub{padding:0;margin:4px 0 0}
.wg-note{font-size:12px;color:var(--faint);margin:-4px 0 0}
.wg-empty{grid-column:1/-1;align-items:center;text-align:center;padding:32px}
.wg-empty p{margin:0;color:var(--muted)}
.wg .ny .jp-item{border-bottom:1px solid var(--line-2);border-radius:0;padding:9px 2px}
.wg .ny .jp-item:last-child{border-bottom:0}
.wg-yours .yj{grid-template-columns:repeat(4,minmax(0,1fr));margin:0}
.wl{display:flex;flex-direction:column}
.wl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.wl-row:last-child{border-bottom:0}
.wl-row b,.tr-b b{display:block;font-weight:600;font-size:13.5px}
.wl-row small,.tr-b small{display:block;color:var(--muted);font-size:12.5px}
/* calendar */
.cal-day{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink-2)}
.cal-day span{font-weight:400;color:var(--muted)}
.cal-list{display:flex;flex-direction:column;gap:4px}
.cal-row{display:grid;grid-template-columns:48px 3px minmax(0,1fr);gap:10px;align-items:start;padding:8px 6px;border-radius:9px}
.cal-row.live{background:var(--sel-soft)}
.cal-row.past{opacity:.5}
.cal-time{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal-time small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.cal-bar{align-self:stretch;border-radius:2px;background:var(--line-strong)}
.cal-row.client .cal-bar{background:#0473EA}
.cal-row.team .cal-bar{background:#38D200}
.cal-row.self .cal-bar{background:var(--human)}
.cal-t b{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.cal-t small{display:block;color:var(--muted);font-size:12.5px}
.cal-tag{grid-column:3;display:flex;align-items:center;gap:8px;margin-top:2px}
.cal-tag:empty{display:none}
.cal-live{font-size:11.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.cal-next{font-size:12px;font-weight:600;color:var(--link)}
.cal-join{height:26px;padding:0 12px;font-size:12.5px;background:#0473EA;border-color:#0473EA;color:#fff}
.cal-join:hover{background:#0360C4}
/* weather */
.we-now{display:flex;align-items:center;gap:12px}
.we-ic{width:48px;height:48px;border-radius:12px;background:var(--sel);color:var(--link);display:grid;place-items:center}
.we-ic svg{width:28px;height:28px}
.we-t{display:block;font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.we-now small{color:var(--muted);font-size:13px}
.we-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.we-hrs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--line-2);padding-top:10px}
.we-hrs span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.we-hrs b{color:var(--ink);font-size:13px;font-weight:600}
.we-hrs svg{width:18px;height:18px;color:var(--ink-2)}
/* world clock */
.wc{display:flex;flex-direction:column}
.wc-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.wc-row:last-child{border-bottom:0}
.wc-ic{color:var(--faint);display:grid}
.wc-ic svg{width:16px;height:16px}
.wc-c b{display:block;font-size:13.5px;font-weight:600}
.wc-c small{display:block;font-size:12px;color:var(--muted)}
.wc-t{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* leave */
.lv-top{display:flex;align-items:center;gap:12px}
.lv-n{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
.lv-top span{font-size:13.5px;color:var(--ink-2)}
.lv-top small{display:block;color:var(--muted);font-size:12px}
.lv-bar{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.lv-bar i{display:block;height:100%;background:#0473EA;border-radius:inherit}
/* team leave */
.tl-week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tl-week>span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:9px;border:1px solid var(--line-2)}
.tl-week>span.today{border-color:var(--link);background:var(--sel-soft)}
.tl-week small{font-size:11.5px;color:var(--muted)}
.tl-week b{font-size:15px;font-weight:600}
.tl-n{font-style:normal;font-size:11px;font-weight:600;color:var(--amber)}
.tl-n.none{color:var(--faint);font-weight:500}
.tl-who{display:flex;align-items:center;gap:10px;min-width:0}
.tl-av{width:30px;height:30px;border-radius:50%;background:var(--hover);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.tl-when{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
/* trips */
.tr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.tr:last-child{border-bottom:0}
.tr-ic{width:32px;height:32px;border-radius:9px;background:var(--hover);color:var(--ink-2);display:grid;place-items:center}
.tr-d{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tr .chip{white-space:nowrap}
.w-menu{min-width:230px}
.w-menu [role=menuitemcheckbox]::after{content:"";width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);flex:none}
.w-menu [role=menuitemcheckbox][aria-checked="true"]::after{content:"✓";display:grid;place-items:center;background:#0473EA;border-color:#0473EA;color:#fff;font-size:11px;font-weight:700}
#wEdit{gap:6px}
@media (max-width:1180px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wg-cal{grid-row:auto}.wg-yours .yj{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.wgrid{grid-template-columns:1fr}.wg-needs{grid-column:auto}.wg-yours .yj{grid-template-columns:1fr}}
/* Calendar widget: month view + day agenda */
.wg-body{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.mc{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.mc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-h b{font-size:13.5px;font-weight:600}
.mc-nav{display:flex;align-items:center;gap:2px}
.mc-nav button{height:26px;min-width:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.mc-nav button:hover{background:var(--hover)}
.mc-nav svg{width:15px;height:15px}
.mc-nav .mc-today{padding:0 8px;font-size:12.5px;font-weight:600;color:var(--link);margin-right:2px}
.mc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc-w{font-size:11px;color:var(--faint);font-weight:600;padding:2px 0 4px}
.mc-d{position:relative;height:32px;border-radius:8px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);display:grid;place-items:center}
.mc-d:hover{background:var(--hover)}
.mc-d.out{color:var(--faint)}
.mc-d.leave{background:var(--green-bg);color:var(--green)}
.mc-d.trip{background:var(--sel);color:var(--sel-ink)}
.mc-d.hol{color:var(--red);font-weight:600}
.mc-d.today{font-weight:700;color:#0473EA;box-shadow:inset 0 0 0 1.5px #0473EA}
.mc-d.sel{background:#0473EA;color:#fff;font-weight:600;box-shadow:none}
.mc-d.sel .mc-dot{background:#fff}
.mc-dot{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--faint)}
.mc-d.today .mc-dot{background:#0473EA}
.mc-key{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:2px}
.mc-key span{display:inline-flex;align-items:center;gap:5px}
.mc-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.k-leave{background:var(--green-bg);border:1px solid var(--green-line)}
.k-trip{background:var(--sel);border:1px solid var(--sel-line)}
.k-hol{background:var(--red-bg);border:1px solid var(--red-line)}
.k-dot{width:5px!important;height:5px!important;border-radius:50%!important;background:var(--faint)}
.cal-day b{font-weight:600;color:var(--ink)}
.cal-row.allday .cal-time{font-size:12px;font-weight:600;color:var(--muted)}
.cal-row.leave .cal-bar{background:var(--green)}
.cal-row.trip .cal-bar{background:#0473EA}
.cal-row.holiday .cal-bar{background:var(--red)}
.cal-empty{font-size:13px;color:var(--muted);padding:8px 6px}
/* Month view, calmer: circles, one small marker */
.mc-g{gap:0}
.mc-d,.mc-d.leave,.mc-d.trip,.mc-d.hol,.mc-d.today,.mc-d.sel{position:relative;height:36px;background:none;box-shadow:none;border-radius:0;display:grid;place-items:center;color:var(--ink);font-weight:400}
.mc-d:hover{background:none}
.mc-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.mc-d:hover .mc-n{background:var(--hover)}
.mc-d.out .mc-n{color:var(--faint)}
.mc-d.today .mc-n{box-shadow:inset 0 0 0 1.5px #0473EA;color:#0473EA;font-weight:600}
.mc-d.sel .mc-n,.mc-d.sel:hover .mc-n{background:#0473EA;color:#fff;font-weight:600;box-shadow:none}
.mc-m{position:absolute;bottom:1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;display:block}
.mc-m.leave{background:var(--green)}
.mc-m.trip{background:#0473EA}
.mc-m.hol{background:var(--red)}
.mc-key .mc-m{position:static;margin:0;width:6px;height:6px}
.mc-key{gap:14px}
@media (max-width:480px){#titleArea>.t-div{display:none}}
@media (max-width:720px){#titleArea .j-title{min-width:0}.jt-j{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}}
/* Four-column home board on wide screens */
@media (min-width:1400px){
  .wgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .wg-needs{grid-column:span 2}
  .wg-cal{grid-row:span 2}

}
/* Board balance */

.we-days{display:flex;flex-direction:column;border-top:1px solid var(--line-2);padding-top:6px}

.we-day em{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px}
@media (min-width:1400px){

  .wg-yours{grid-column:auto}

@media (max-width:1180px) and (min-width:721px){.wg-yours{grid-column:auto}.wg-yours .yj{grid-template-columns:1fr;gap:8px}}
html[data-theme="dark"] .mega-card.dark{background-color:#262626;background-image:none;border:1px solid var(--line)}
html[data-theme="dark"] .mega-card.dark p{color:var(--muted)}
/* No Me button inside apps */
body.app #meWrap,body.jrny #meWrap{display:none}
/* ===== Widget edit mode (iOS-style) ===== */
.wg{position:relative}
.wg-x{position:absolute;top:-9px;left:-9px;z-index:3;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25);animation:wgx-in .22s var(--ease) both}
.wg-x svg{width:14px;height:14px;stroke-width:2.6}
.wg-x:hover{transform:scale(1.08)}
@keyframes wgx-in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.wgrid.editing .wg>*:not(.wg-x){pointer-events:none;user-select:none}
.wgrid.editing .wg{animation:wg-jiggle .2s ease-in-out infinite;transform-origin:50% 50%}
.wgrid.editing .wg:nth-child(2n){animation-duration:.22s;animation-delay:-.08s}
.wgrid.editing .wg:nth-child(3n){animation-duration:.18s;animation-delay:-.12s}
.wgrid.editing .wg-needs,.wgrid.editing .wg-cal,.wgrid.editing .wg-yours{animation-name:wg-jiggle-lg}
@keyframes wg-jiggle{0%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}100%{transform:rotate(-.6deg)}}
@keyframes wg-jiggle-lg{0%{transform:rotate(-.25deg)}50%{transform:rotate(.25deg)}100%{transform:rotate(-.25deg)}}
.wg.wg-out{animation:wg-out .22s ease forwards!important}
@keyframes wg-out{to{opacity:0;transform:scale(.92)}}
.wg.wg-in{animation:wg-in .32s var(--ease) both}
.wgrid.editing .wg.wg-in{animation:wg-in .32s var(--ease) both,wg-jiggle .2s ease-in-out .32s infinite}
@keyframes wg-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.wg-tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:14px;background:var(--white);animation:wg-in .25s var(--ease) both}
.wg-tray-l{font-size:13px;color:var(--muted);margin-right:4px}
.wg-add{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border:1px solid var(--line);border-radius:999px;background:var(--white);font-size:13px;font-weight:500;color:var(--ink-2)}
.wg-add:hover{background:var(--hover);color:var(--ink)}
.wg-add svg{width:14px;height:14px}
#wEdit.dark{min-width:72px;justify-content:center}
@media (prefers-reduced-motion:reduce){.wgrid.editing .wg,.wg.wg-in,.wg.wg-out,.wg-x,.wg-tray{animation:none!important}}
/* Sliding pill highlight */
.pill{position:relative}
.pill-ind{position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;background:var(--active);z-index:0;pointer-events:none;transition:transform .38s var(--ease),opacity .2s ease}
.pill>*:not(.pill-ind){position:relative;z-index:1}
.pill-btn[aria-current="true"]{background:transparent;color:var(--ink)}
.pill-btn:hover{background:var(--hover)}
.pill-btn[aria-current="true"]:hover{background:transparent}
@media (prefers-reduced-motion:reduce){.pill-ind{transition:none}}

.we-ic{width:auto;height:auto;background:none;border-radius:0;color:var(--ink-2)}

@media (min-width:1400px){.tr{grid-template-columns:24px minmax(0,1fr)}}

.tl-cap{font-size:12.5px;color:var(--muted);margin-top:-4px}
.tl-alert{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--red);background:var(--red-bg);border:1px solid var(--red-line);border-radius:10px;padding:8px 10px}
.tl-alert svg{width:15px;height:15px;flex:none;margin-top:1px}

.tl-week>span{gap:4px;padding:7px 2px 8px;min-height:84px;justify-content:flex-start}
.tl-week>span.low{border-color:var(--red-line);background:var(--red-bg)}

.tl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.tl-row:last-child{border-bottom:0}
.tl-rl{min-width:0}
.tl-rl b{display:block;font-weight:600;font-size:13.5px}
.tl-rl small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-cnt{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.tl-row.low .tl-cnt{color:var(--red);background:var(--red-bg);border-color:var(--red-line)}

.tl-stack .tl-av{width:22px;height:22px;font-size:9px;margin-left:-4px}
.tl-stack .tl-av:first-child{margin-left:0}
/* Person hover card */
.pname{color:var(--link);font-weight:500;cursor:default;border-radius:3px}
.pname:hover,.pname:focus-visible{text-decoration:underline;outline:none}

function renderTier(sec){

  function entrance(){
  const head=[...document.querySelectorAll("#homeView>*:not(.wgrid)")],wgs=[...document.querySelectorAll("#homeView .wgrid>.wg")],items=[...head,...wgs];
  head.forEach((el,i)=>el.style.setProperty("--d",(i*0.06).toFixed(2)+"s"));

  const g=document.querySelector("#homeView .wgrid"),gr=g&&g.getBoundingClientRect();let nl=0,nr=0;const base=head.length*0.06;

    setTimeout(()=>B.classList.add("b-content"),560);
    setTimeout(()=>{B.classList.remove("boot","b-rail","b-top","b-content");items.forEach(el=>{el.style.removeProperty("--d");el.classList.remove("b-from-l","b-from-r")})},560+items.length*60+900)}))}})();

/* ---------- Platform search: pill that expands across the bar, finds journeys, clients, people and apps ---------- */
const SCOPES=[["all","All"],["journey","Journeys"],["client","Clients"],["person","People"],["app","Apps"]];
let sScope="all",sSel=0,sItems=[],sOpen=false;
function searchIndex(){const out=[];
  Object.keys(DJ).forEach(d=>DJ[d].forEach((J,i)=>out.push({k:"journey",t:J[1],m:DOMAINS[d],x:J[0]+" "+J[2],icon:"route",go:()=>enterJourney(d,i)})));

  Object.entries(PEOPLE).forEach(([ini,P])=>out.push({k:"person",t:P[0],m:P[1],x:P[4],ini,go:()=>toast(`${P[0].split(" ")[0]}'s profile isn't part of this prototype yet`,false)}));

  return out}
const KLABEL={journey:"Journeys",client:"Clients",person:"People",app:"Apps"};
function hl(t,q){if(!q)return t;const i=t.toLowerCase().indexOf(q);return i<0?t:t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length)}
function sIcon(r){if(r.k==="person")return `<span class="sr-av">${r.ini}</span>`;if(r.k==="app")return `<span class="sr-app" style="background:${r.app.color};color:${r.app.fg}">${ic(r.app.icon,"i s")}</span>`;return `<span class="sr-ic">${ic(r.icon,"i s")}</span>`}
function drawSearch(){const p=document.getElementById("sPanel");if(!p)return;const q=$("#q").value.trim().toLowerCase();
  let list;
  if(!q){const idx=searchIndex(),pick=(k,t)=>idx.find(r=>r.k===k&&r.t===t);
    list=[pick("client","Halcyon Logistics"),pick("journey","Onboard a new client"),pick("person","Priya Narayan"),pick("app","agentOS")].filter(Boolean).filter(r=>sScope==="all"||r.k===sScope)}
  else list=searchIndex().filter(r=>(sScope==="all"||r.k===sScope)&&(r.t+" "+r.m+" "+r.x).toLowerCase().includes(q));
  const groups={};list.forEach(r=>{(groups[r.k]=groups[r.k]||[]).push(r)});
  sItems=[];let html="";
  if(!q)html+=`<div class="sp-h">Recent</div>`+list.map(r=>{sItems.push(r);return row(r,sItems.length-1,q)}).join("");
  else Object.keys(KLABEL).forEach(k=>{if(!groups[k])return;const g=groups[k].slice(0,sScope==="all"?4:12);html+=`<div class="sp-h">${KLABEL[k]}${groups[k].length>g.length?` · ${groups[k].length}`:""}</div>`+g.map(r=>{sItems.push(r);return row(r,sItems.length-1,q)}).join("")});
  if(q&&!sItems.length)html=`<div class="sp-empty"><b>No matches for "${q.replace(/</g,"&lt;")}"</b><span>Try a client name, a journey like "onboard", or a colleague.</span></div>`;
  sSel=Math.min(sSel,Math.max(0,sItems.length-1));
  p.querySelector(".sp-scopes").innerHTML=SCOPES.map(([k,l])=>`<button class="sp-chip" data-scope="${k}" aria-pressed="${sScope===k}">${l}</button>`).join("");
  p.querySelector(".sp-list").innerHTML=html;markSel();
  function row(r,n,q){return `<button class="sr" role="option" id="sr${n}" data-sr="${n}" aria-selected="false">${sIcon(r)}<span class="sr-b"><b>${hl(r.t,q)}</b><small>${r.m}</small></span>${!q||sScope!=="all"?"":`<span class="sr-k">${{journey:"Journey",client:"Client",person:"Person",app:"App"}[r.k]}</span>`}</button>`}}
function markSel(){const p=document.getElementById("sPanel");if(!p)return;p.querySelectorAll(".sr").forEach((b,n)=>{b.setAttribute("aria-selected",String(n===sSel));b.classList.toggle("on",n===sSel)});

/* The panel is sized to where the search ENDS UP, never to where it is mid-animation, so it never jumps */
let sGeo=null;

  const g=sGeo||{left:r.left,width:r.width,bottom:r.bottom},w=Math.max(g.width,Math.min(560,innerWidth-16));

function openSearch(){if(sOpen)return;sOpen=true;closeJPanel();closeMenus();
  const S=$(".search"),top=$(".top").getBoundingClientRect(),r=S.getBoundingClientRect(),wide=innerWidth>480;
  if(wide){const ph=document.createElement("span");ph.className="search-ph";ph.style.width=r.width+"px";S.after(ph);

    if(actTab){actTab.style.maxWidth=actTab.getBoundingClientRect().width+"px";actTab.style.flex="none"}clearTimeout(closeSearch._t);document.body.classList.add("s-fold");

      :Math.min(taEl.getBoundingClientRect().right,Math.max(0,...[...taEl.children].map(c=>c.getBoundingClientRect().right))))-top.left+32;
    let target=Math.max(r.width,Math.min(680,top.width-32)),L=Math.max(16,Math.min(top.width-16-target,top.width/2-target/2));

  setTimeout(()=>{if(document.body.contains(p))p.classList.add("on")},wide?170:0)}
function closeSearch(){if(!sOpen)return;sOpen=false;sGeo=null;

  clearTimeout(closeSearch._t);closeSearch._t=setTimeout(()=>{document.body.classList.remove("s-fold");document.querySelectorAll("#titleArea .ptab").forEach(t=>{t.style.maxWidth="";t.style.flex=""})},matchMedia("(prefers-reduced-motion: reduce)").matches?0:340);const S=$(".search"),ph=document.querySelector(".search-ph"),p=document.getElementById("sPanel");
